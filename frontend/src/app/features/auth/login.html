<section class="auth-card">
  <p class="eyebrow">Enquiry Management</p><h2>Welcome back</h2><p class="muted">Sign in to continue to your workspace.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
    @if (error()) { <div class="alert" role="alert">{{ error() }}</div> }
    <div class="field"><label for="identifier">Email or Username <span class="required">*</span></label><input id="identifier" formControlName="identifier" autocomplete="username" placeholder="Email or username" /><app-field-error [control]="form.controls.identifier" label="Username" /></div>
    <div class="field"><label for="password">Password <span class="required">*</span></label><div class="input-with-action"><input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Password" /><button class="input-action" type="button" (click)="showPassword.set(!showPassword())" aria-label="Toggle secret visibility" [title]="showPassword() ? 'Hide password' : 'Show password'"><app-svg-icon [name]="showPassword() ? 'eye-off' : 'eye'" /></button></div><app-field-error [control]="form.controls.password" label="Password" /></div>
    <div class="auth-options"><label class="check-label"><input type="checkbox" formControlName="remember" />Remember me</label><a routerLink="/auth/forgot-password">Forgot password?</a></div>
    <button class="btn btn-primary" type="submit" [disabled]="submitting()">@if (submitting()) { <app-button-loader /> Signing in... } @else { Sign in }</button>
  </form>
  <p class="auth-switch">Don't have an account? <a routerLink="/auth/register">Register</a></p>
</section>
