<div class="pagination">
  <span
    >Showing {{ total() ? (page() - 1) * size() + 1 : 0 }}–{{ end() }} of
    {{ total() }} records</span
  >
  <div class="actions">
    <label for="page-size">Rows</label
    ><select
      id="page-size"
      class="select-input"
      [formControl]="sizeControl"
      (change)="sizeChanged.emit(sizeControl.value)"
    >
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="25">25</option></select
    ><button
      class="btn btn-sm"
      [disabled]="page() <= 1"
      (click)="pageChanged.emit(page() - 1)"
      aria-label="Previous page"
    >
      <app-svg-icon name="chevron-left" /></button
    ><span>Page {{ page() }} of {{ pages() }}</span
    ><button
      class="btn btn-sm"
      [disabled]="page() >= pages()"
      (click)="pageChanged.emit(page() + 1)"
      aria-label="Next page"
    >
      <app-svg-icon name="chevron-right" />
    </button>
  </div>
</div>
