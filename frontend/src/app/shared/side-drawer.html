@if (open()) {
  <div class="drawer-layer">
    <button class="drawer-backdrop" type="button" aria-label="Close drawer" (click)="requestClose()"></button>
    <aside class="side-drawer" [class.drawer-enquiry]="width() === 'enquiry'" [class.drawer-wide]="width() === 'wide'" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <header class="drawer-header">
        <div><h2>{{ title() }}</h2>@if (subtitle()) { <p>{{ subtitle() }}</p> }</div>
        <button class="btn btn-text" type="button" aria-label="Close drawer" [disabled]="loading()" (click)="requestClose()"><app-svg-icon name="close" /></button>
      </header>
      <div class="drawer-body"><ng-content /></div>
      <footer class="drawer-footer"><ng-content select="[drawer-footer]" /></footer>
    </aside>
  </div>
}
