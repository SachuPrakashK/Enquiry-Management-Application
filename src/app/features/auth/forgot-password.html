<section class="auth-card"><p class="eyebrow">Account recovery</p><h2>Forgot password?</h2><p class="muted">Enter the email associated with your account.</p>@if (sent()) { <div class="alert info-alert" role="status">If an account exists for this email, password reset instructions have been prepared.</div> } @else { <form [formGroup]="form" (ngSubmit)="submit()" class="stack"><div class="field"><label for="recoveryEmail">Email <span class="required">*</span></label><input id="recoveryEmail" type="email" formControlName="email" /><app-field-error [control]="form.controls.email" label="Email" /></div><button class="btn btn-primary" type="submit" [disabled]="saving()">@if (saving()) { <app-button-loader /> Submitting... } @else { Continue }</button></form>}<p class="auth-switch"><a routerLink="/auth/sign-in">Back to Sign In</a></p></section>
